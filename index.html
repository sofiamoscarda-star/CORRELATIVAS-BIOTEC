<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biotecnología - Malla Interactiva</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

    <div id="login-screen" class="modal active">
        <div class="modal-content">
            <h2>Sincronización de Datos</h2>
            <p>Usá siempre el mismo nombre para ver tu progreso en celular, PC o tablet.</p>
            <input 
                type="text" 
                id="username-input" 
                placeholder="Tu usuario o clave"
                onkeydown="if(event.key === 'Enter') login()"
            >
            <button onclick="login()">Ingresar</button>
        </div>
    </div>

    <nav id="main-nav">
        <h1>BIOTECNOLOGÍA</h1>
        <div class="tabs">
            <button onclick="switchTab('correlatividades', event)" class="active">Correlatividades</button>
            <button onclick="switchTab('materias', event)">Materias</button>
            <button onclick="switchTab('promedios', event)">Promedio General</button>
        </div>
    </nav>

    <main id="app-container">
        <section id="tab-correlatividades" class="tab-content">
            <div id="malla-grid" class="malla-grid"></div>
        </section>

        <section id="tab-materias" class="tab-content hidden">
            <div id="materias-list"></div>
        </section>

        <section id="tab-promedios" class="tab-content hidden">
            <div class="promedio-card">
                <h2>Promedio General: <span id="promedio-general-val">-</span></h2>
            </div>

            <table id="tabla-promedios">
                <thead>
                    <tr>
                        <th>Materia</th>
                        <th>Año</th>
                        <th>Nota Final</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <footer id="progress-footer">
        <div id="progress-text">Progreso: 0%</div>
        <div class="progress-bar-bg">
            <div id="progress-bar"></div>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
