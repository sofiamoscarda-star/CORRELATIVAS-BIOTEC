<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biotecnología - Malla Interactiva</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

    <div id="login-screen" class="modal active">
        <div class="modal-content">
            <h2>Sincronización de Datos</h2>
            <p>Ingresa tu usuario para sincronizar con tu celular/PC.</p>
            <input type="text" id="username-input" placeholder="Ej: Franco123">
            <button onclick="login()">Ingresar</button>
        </div>
    </div>

    <nav id="main-nav">
        <h1>BIOTECNOLOGÍA</h1>
        <div class="tabs">
            <button onclick="switchTab('correlatividades')" class="active">Correlatividades</button>
            <button onclick="switchTab('materias')">Materias</button>
            <button onclick="switchTab('promedios')">Promedio General</button>
        </div>
    </nav>

    <main id="app-container">
        
        <section id="tab-correlatividades" class="tab-content active">
            <div id="malla-grid" class="malla-grid">
                </div>
        </section>

        <section id="tab-materias" class="tab-content">
            <div id="materias-list">
                </div>
        </section>

        <section id="tab-promedios" class="tab-content">
            <div class="promedio-card">
                <h2>Promedio General: <span id="promedio-general-val">-</span></h2>
            </div>
            <table id="tabla-promedios">
                <thead>
                    <tr>
                        <th>Materia</th>
                        <th>Año</th>
                        <th>Nota Final</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>

    </main>

    <footer id="progress-footer">
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p>Progreso: <span id="progress-text">0%</span></p>
    </footer>

    <div id="informe-modal" class="modal">
        <div class="modal-content informe-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Nombre Materia</h2>
            <h3 class="nota-destacada">Nota Final: <span id="modal-nota-final">-</span></h3>

            <div class="informe-grid">
                <div class="informe-section">
                    <h3>Datos de Exámenes</h3>
                    <div id="examenes-list"></div>
                    <button onclick="addExamen()">+ Agregar Examen</button>
                </div>

                <div class="informe-section">
                    <h3>Trabajos con Nota</h3>
                    <div id="trabajos-list"></div>
                    <button onclick="addTrabajo()">+ Agregar Trabajo</button>
                </div>
            </div>
            
            <div class="config-porcentajes">
                <h3>Porcentajes (Suman 100%)</h3>
                <label>Exámenes (%): <input type="number" id="peso-examenes" value="70"></label>
                <label>Trabajos (%): <input type="number" id="peso-trabajos" value="30"></label>
            </div>

            <button class="save-btn" onclick="saveInforme()">Guardar Cambios</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
